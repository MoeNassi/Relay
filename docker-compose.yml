# Production deployment for Relay.
#
#   docker compose up -d --build     build + start
#   docker compose logs -f           tail logs
#   docker compose down              stop (data volume preserved)
#
# The app (UI + API + WebSocket) is served on port 5181. Put a TLS-terminating
# reverse proxy (nginx/Caddy/Traefik) in front for HTTPS — see DEPLOY.md.
#
# SSO is optional: leave the RELAY_SSO_* vars unset to run without sign-in
# (local dev user). To enable Microsoft Entra SSO, copy .env.example to .env,
# fill it in, and the values below pick it up.

services:
  relay:
    build: .
    image: relay:latest
    restart: unless-stopped
    ports:
      - "5181:5181"
    environment:
      NODE_ENV: production
      # SSO kill-switch — currently 1 (SSO OFF, browser signs in as the local
      # dev user) while the app is in dev. Set RELAY_SSO_DISABLED=0 on the
      # deploy host (or change the default below) to turn Microsoft SSO back on.
      RELAY_SSO_DISABLED: ${RELAY_SSO_DISABLED:-1}
      # --- optional Microsoft Entra SSO (omit to disable) ---
      RELAY_SSO_TENANT_ID: ${RELAY_SSO_TENANT_ID:-}
      RELAY_SSO_CLIENT_ID: ${RELAY_SSO_CLIENT_ID:-}
      RELAY_SSO_CLIENT_SECRET: ${RELAY_SSO_CLIENT_SECRET:-}
      RELAY_SSO_REDIRECT_URI: ${RELAY_SSO_REDIRECT_URI:-}
      RELAY_SSO_ALLOWED_DOMAIN: ${RELAY_SSO_ALLOWED_DOMAIN:-um6p.ma}
      RELAY_SSO_SECURE: ${RELAY_SSO_SECURE:-1}
      # --- VMProv auto-provisioning (worker turns ON only when AGENT_TOKEN and
      # CALLBACK_URL are both set; otherwise it stays off) ---
      RELAY_VM_AGENT_URL: ${RELAY_VM_AGENT_URL:-https://vmprov.um6p.ma/api/agent/jobs}
      RELAY_VM_AGENT_TOKEN: ${RELAY_VM_AGENT_TOKEN:-}
      RELAY_VM_CALLBACK_URL: ${RELAY_VM_CALLBACK_URL:-}
      RELAY_VM_CALLBACK_TOKEN: ${RELAY_VM_CALLBACK_TOKEN:-}
      RELAY_VM_SITE: ${RELAY_VM_SITE:-}
      RELAY_VM_REQUESTER: ${RELAY_VM_REQUESTER:-}
      RELAY_VM_NEXT_STAGE: ${RELAY_VM_NEXT_STAGE:-}
      # VMProv (and any other internal endpoint) serves a self-signed cert.
      # Two ways to get past it:
      #  - Secure: point Node at the cert to trust,
      #      NODE_EXTRA_CA_CERTS=/app/certs/vmprov.crt (drop it in ./certs).
      #  - Quick (internal/test hosts only): NODE_TLS_REJECT_UNAUTHORIZED=0
      #      disables ALL outbound TLS verification for the process.
      NODE_EXTRA_CA_CERTS: ${NODE_EXTRA_CA_CERTS:-}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-}
    volumes:
      # persist projects.json + api-keys.json across restarts/rebuilds
      - relay-data:/app/server/data
      # extra CA / self-signed certs for outbound TLS (read-only)
      - ./certs:/app/certs:ro

volumes:
  relay-data:
